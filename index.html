<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flag Battle</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="stage">

  <header class="banner">
    <div class="banner__top">
      <div class="banner__side banner__side--left">
        <span class="banner__label">Participants</span>
        <span class="banner__value" id="aliveCount">0</span>
      </div>

      <div class="banner__center">
        <div class="banner__title">COUNTRY FLAGS BATTLE</div>
        <div class="banner__round" id="roundDisplay">ROUND 0</div>
      </div>

      <div class="banner__side banner__side--right">
        <span class="banner__label">Next round</span>
        <span class="banner__value" id="nextRoundTimer">—</span>
      </div>
    </div>

    <div class="banner__status">
      <span id="statusText">Flags are loading…</span>
    </div>

    <!-- RAUNDLAR TARIXI: har raund g'olibi shu yerga yoziladi -->
    <div class="rounds" id="roundHistory">
      <span class="rounds__empty">Round winners will appear here</span>
    </div>
  </header>

  <main class="arena-wrap">
    <canvas id="arena"></canvas>
    <div class="arena-glow"></div>

    <!-- G'OLIB: doira markazida -->
    <div class="winner-circle" id="winnerCircle">
      <span class="winner-circle__flag" id="winnerFlag">🏳️</span>
      <span class="winner-circle__name" id="winnerName"></span>
    </div>
  </main>

</div>
<script src="audio.js"></script>
<script src="index.js"></script>
</body>
</html>
